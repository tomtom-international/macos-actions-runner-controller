run:
  tests: true
  timeout: 15m
output:
  show-stats: true
  formats: colored-line-number
linters:
  enable:
    - asciicheck
    - bidichk
    - errorlint
    - errcheck
    - copyloopvar
    - gosec
    - revive
    - stylecheck
    - tparallel
    - unconvert
    - unparam
    - gocyclo
    - whitespace
    - govet
    - goimports
    - goheader
    - misspell
    - nilerr
    - bodyclose
    - dupl
    - gochecknoinits
    - gocritic
    - gosimple
    - ineffassign
    - nakedret
    - staticcheck
    - typecheck
    - unused
    - goconst
    - lll
  fast: false
  disable:
    - prealloc

linters-settings:
  dupl:
    threshold: 100
  gocyclo:
    min-complexity: 12
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
        disabled: true
  misspell:
    locale: US
  goconst:
    min-len: 2
    min-occurrences: 3
  lll:
    line-length: 140
  gocritic:
    enabled-tags:
      - performance
    disabled-checks:
      - rangeValCopy

issues:
  exclude-rules:
    - path: pkg/clients/sqs/client.go
      linters:
        - gosec
      text: "G404"
